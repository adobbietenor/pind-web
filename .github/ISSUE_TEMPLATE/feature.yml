name: Feature or change request
description: A new feature, a change to something that exists, copy, or design
labels: ["feature", "triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change?
      options:
        - "New feature - does not exist yet"
        - "Enhancement - change to something that exists"
        - "Copy or content - wording, labels, text"
        - "Design or visual - look, layout, branding"
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Which part of Pin'd?
      options:
        - "Not sure / cannot tell"
        - "W1 - Web, this week's crowds (landing)"
        - "W2 - Web, crowd page before pinning"
        - "W3 - Web, share card"
        - "W4 - Web, links"
        - "A1-A4 - App, onboarding and sign up"
        - "A5-A7 - App, home and this week's crowds"
        - "A8-A10 - App, crowd page"
        - "A11-A13, A15, A17 - App, crew"
        - "A14 - App, crew thread"
        - "A16 - App, after the event"
        - "A18 - App, notifications"
        - "A19 - App, my events"
        - "A20 - App, connections"
        - "A21-A22 - App, profile"
        - "A23 - App, safety and settings"
        - "A24 - App, report and block"
        - "A26 - App, quick pin"
        - "A27 - App, opt in"
        - "A28 - App, solo crew opt-in"
        - "A29 - App, proposals and plan"
        - "T1 - Fan-channel post"
        - "Something new, no screen yet"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What do you want it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: One or two lines is plenty.
    validations:
      required: true
  - type: checkboxes
    id: first-test
    attributes:
      label: Timing
      options:
        - label: This has to be in before the first real crowd test
  - type: textarea
    id: reference
    attributes:
      label: Screenshot, sketch, or example
      description: Drag in an image, or paste a link to another app doing it well.