name: Bug report
description: Something is broken, missing, or behaving wrong
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: screen
    attributes:
      label: Which part of Pin'd?
      options:
        - "Not sure / cannot tell"
        - "W1 - Web, this week's crowds (landing)"
        - "W2 - Web, crowd page before pinning"
        - "W3 - Web, share card"
        - "W4 - Web, links"
        - "A1-A4 - App, onboarding and sign up"
        - "A5-A7 - App, home and this week's crowds"
        - "A8-A10 - App, crowd page"
        - "A11-A13, A15, A17 - App, crew"
        - "A14 - App, crew thread"
        - "A16 - App, after the event"
        - "A18 - App, notifications"
        - "A19 - App, my events"
        - "A20 - App, connections"
        - "A21-A22 - App, profile"
        - "A23 - App, safety and settings"
        - "A24 - App, report and block"
        - "A26 - App, quick pin"
        - "A27 - App, opt in"
        - "A28 - App, solo crew opt-in"
        - "A29 - App, proposals and plan"
        - "T1 - Fan-channel post"
        - "Something new, no screen yet"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What you expected instead
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: Rough steps are fine. Leave blank if it was a one-off.
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - "Blocker - cannot continue past this"
        - "Broken, but there is a way around it"
        - "Annoying"
        - "Cosmetic"
    validations:
      required: true
  - type: checkboxes
    id: first-test
    attributes:
      label: Timing
      options:
        - label: This has to be fixed before the first real crowd test
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or screen recording
      description: Drag an image or video straight into this box.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 14, Safari