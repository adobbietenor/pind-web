<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0A0D" />
    <title>%WEB_TITLE%</title>
    <!-- Expo's SPA template plus the dark background (tokens.ts), so the page
         never flashes white before the app loads. Dark always. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #0b0a0d;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
